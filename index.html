<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Rock Paper Scissors!</h1>
    <div class="buttons">
        <button class="btn" id="rock">Rock 🗿</button>
        <button class="btn" id="paper">Paper 📄</button>
        <button class="btn" id="scissors">Scissors ✂️</button></div>
    <div class="display">
        <div>
            <p class="playerscore">Your Score: 0</p>
            <div class="playerbox box"></div>
        </div>

        <button class="start">START</button>

        <div>
            <p class="computerscore">Computer Score: 0</p>
            <div class="computerbox box"></div>
        </div>
    </div>
    <div class="winner"><h1 class="winnertxt"></h1></div>
    <script src="main.js"></script>
</body>
</html>
